<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="{{ROBOTS}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#25272c">
<script>{{THEME_SCRIPT}}</script>
<link rel="preload" href="{{ASSETS}}/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ASSETS}}/fonts/source-serif-4-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ASSETS}}/css/main.css">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="{{ASSETS}}/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ASSETS}}/img/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{APP_NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{SITE_URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{APP_NAME}}: type faster and learn new English words">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{SITE_URL}}/og-image.png">
<script type="application/json" id="app-config">{{CONFIG_JSON}}</script>
